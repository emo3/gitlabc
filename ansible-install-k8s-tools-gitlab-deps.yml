---
- name: Install kubectl, Helm, k3d and verify prerequisites
  hosts: all
  become: true
  gather_facts: true

  vars:
    kubectl_version: "v1.36.4"
    helm_version: "v4.2.4"
    glab_version: "1.114.0"
    helm_git_plugin_url: "https://github.com/aslafy-z/helm-git"
    k3d_version: "5.9.0"
    k3s_image: ""
    mkcert_version: "v1.4.4"
    install_dir: "/usr/local/bin"
    install_docker: true
    docker_configure_dns: true
    docker_daemon_config_path: "/etc/docker/daemon.json"
    docker_dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    create_k3d_cluster: true
    k3d_cluster_name: "gitlab-dev"
    k3d_cluster_start_timeout: "2m"
    gitlab_domain: "{{ lookup('ansible.builtin.env', 'GITLAB_DOMAIN') | default('192.168.86.50.nip.io', true) }}"
    k3d_subnet: "172.28.0.0/16"
    k3d_host_gateway_ip: "172.28.0.1"

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

  tasks:
    - name: Set binary architecture
      ansible.builtin.set_fact:
        binary_arch: "{{ arch_map.get(ansible_facts.architecture, ansible_facts.architecture) }}"
      vars:
        arch_map:
          x86_64: amd64
          aarch64: arm64
          arm64: arm64

    - name: Set binary operating system
      ansible.builtin.set_fact:
        binary_os: "{{ os_map.get(ansible_facts.system, ansible_facts.system | lower) }}"
        is_linux: "{{ ansible_facts.system == 'Linux' }}"
        is_macos: "{{ ansible_facts.system == 'Darwin' }}"
        command_path: "{{ install_dir }}:{{ ansible_facts.env.PATH | default('/usr/local/bin:/usr/bin:/bin', true) }}"
        k3d_cluster_name_effective: "{{ k3d_cluster_name | default('gitlab-dev', true) | trim }}"
      vars:
        os_map:
          Linux: linux
          Darwin: darwin

    - name: Set Docker user
      ansible.builtin.set_fact:
        docker_user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id, true) }}"

    - name: Find Docker user's home directory (Linux)
      ansible.builtin.command: "getent passwd {{ docker_user }}"
      register: docker_user_passwd
      changed_when: false
      when: is_linux | bool

    - name: Find Docker user's home directory (macOS)
      ansible.builtin.command: "dscl . -read /Users/{{ docker_user }} NFSHomeDirectory"
      register: docker_user_passwd_macos
      changed_when: false
      when: is_macos | bool

    - name: Set Docker user's home directory (Linux)
      ansible.builtin.set_fact:
        docker_user_home: "{{ docker_user_passwd.stdout.split(':')[5] }}"
      when: is_linux | bool

    - name: Set Docker user's home directory (macOS)
      ansible.builtin.set_fact:
        docker_user_home: "{{ docker_user_passwd_macos.stdout | regex_replace('^NFSHomeDirectory:\\s*', '') | trim }}"
      when: is_macos | bool

    - name: Ensure curl and ca-certificates are installed (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - libnss3-tools
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Ensure curl and ca-certificates are installed (RHEL/CentOS/Fedora)
      ansible.builtin.yum:
        name:
          - curl
          - ca-certificates
          - git
          - nss-tools
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Check whether git is installed
      ansible.builtin.shell: command -v git
      register: git_check
      changed_when: false
      failed_when: false
      become: false
      args:
        executable: /bin/bash

    - name: Require git on macOS
      ansible.builtin.fail:
        msg: "git is required to install the helm-git plugin. On macOS, install Xcode Command Line Tools or git, then rerun this playbook."
      when:
        - is_macos | bool
        - git_check.rc != 0

    - name: Check whether Docker CLI is installed
      ansible.builtin.shell: command -v docker
      register: docker_cli_check
      changed_when: false
      failed_when: false
      args:
        executable: /bin/bash

    - name: Download Docker install script
      ansible.builtin.get_url:
        url: "https://get.docker.com"
        dest: "/tmp/get-docker.sh"
        mode: "0755"
      when:
        - is_linux | bool
        - install_docker | bool
        - docker_cli_check.rc != 0

    - name: Install Docker Engine
      ansible.builtin.command: sh /tmp/get-docker.sh
      when:
        - is_linux | bool
        - install_docker | bool
        - docker_cli_check.rc != 0

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when:
        - is_linux | bool
        - install_docker | bool

    - name: Add local user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      when:
        - is_linux | bool
        - install_docker | bool
        - docker_user != "root"

    - name: Check Docker daemon config
      ansible.builtin.stat:
        path: "{{ docker_daemon_config_path }}"
      register: docker_daemon_config_stat
      when:
        - is_linux | bool
        - docker_configure_dns | bool

    - name: Read Docker daemon config
      ansible.builtin.slurp:
        path: "{{ docker_daemon_config_path }}"
      register: docker_daemon_config_current
      when:
        - is_linux | bool
        - docker_configure_dns | bool
        - docker_daemon_config_stat.stat.exists | default(false)

    - name: Use empty Docker daemon config when none exists
      ansible.builtin.set_fact:
        docker_daemon_config_parsed: {}
      when:
        - is_linux | bool
        - docker_configure_dns | bool
        - not (docker_daemon_config_stat.stat.exists | default(false))

    - name: Parse existing Docker daemon config
      ansible.builtin.set_fact:
        docker_daemon_config_parsed: "{{ (docker_daemon_config_current.content | b64decode | trim) | ternary(docker_daemon_config_current.content | b64decode | from_json, {}) }}"
      when:
        - is_linux | bool
        - docker_configure_dns | bool
        - docker_daemon_config_stat.stat.exists | default(false)

    - name: Configure Docker daemon DNS
      ansible.builtin.copy:
        dest: "{{ docker_daemon_config_path }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ docker_daemon_config_parsed | combine({'dns': docker_dns_servers}, recursive=True) | to_nice_json }}\n"
        validate: "dockerd --validate --config-file %s"
      notify: Restart Docker
      when:
        - is_linux | bool
        - docker_configure_dns | bool

    - name: Apply Docker daemon changes before creating k3d cluster
      ansible.builtin.meta: flush_handlers

    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/{{ binary_os }}/{{ binary_arch }}/kubectl"
        dest: "{{ install_dir }}/kubectl"
        mode: "0755"
        force: true

    - name: Create Helm archive extraction directory
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}"
        state: directory
        mode: "0755"

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}.tar.gz"
        mode: "0644"

    - name: Extract Helm archive
      ansible.builtin.command:
        argv:
          - tar
          - -xzf
          - "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}.tar.gz"
          - -C
          - "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}"
        creates: "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}/{{ binary_os }}-{{ binary_arch }}/helm"

    - name: Install pinned Helm
      ansible.builtin.copy:
        src: "/tmp/helm-{{ helm_version }}-{{ binary_os }}-{{ binary_arch }}/{{ binary_os }}-{{ binary_arch }}/helm"
        dest: "{{ install_dir }}/helm"
        remote_src: true
        mode: "0755"

    - name: Create glab archive extraction directory
      ansible.builtin.file:
        path: "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}"
        state: directory
        mode: "0755"

    - name: Download glab archive
      ansible.builtin.get_url:
        url: "https://gitlab.com/gitlab-org/cli/-/releases/v{{ glab_version }}/downloads/glab_{{ glab_version }}_{{ binary_os }}_{{ binary_arch }}.tar.gz"
        dest: "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}.tar.gz"
        mode: "0644"

    - name: Extract glab archive
      ansible.builtin.command:
        argv:
          - tar
          - -xzf
          - "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}.tar.gz"
          - -C
          - "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}"
        creates: "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}/bin/glab"

    - name: Install pinned glab
      ansible.builtin.copy:
        src: "/tmp/glab-{{ glab_version }}-{{ binary_os }}-{{ binary_arch }}/bin/glab"
        dest: "{{ install_dir }}/glab"
        remote_src: true
        mode: "0755"

    - name: Install helm-git plugin for local user
      ansible.builtin.shell: |
        set -euo pipefail
        if "{{ install_dir }}/helm" plugin list | awk 'NR > 1 { print $1 }' | grep -qx helm-git; then
          exit 0
        fi
        "{{ install_dir }}/helm" plugin install --verify=false "{{ helm_git_plugin_url }}"
        echo "helm-git installed"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        PATH: "{{ command_path }}"
      args:
        executable: /bin/bash
      register: helm_git_plugin_out
      changed_when: "'helm-git installed' in helm_git_plugin_out.stdout"

    - name: Download k3d
      ansible.builtin.get_url:
        url: "https://github.com/k3d-io/k3d/releases/download/v{{ k3d_version }}/k3d-{{ binary_os }}-{{ binary_arch }}"
        dest: "{{ install_dir }}/k3d"
        mode: "0755"
        force: true

    - name: Download mkcert
      ansible.builtin.get_url:
        url: "https://dl.filippo.io/mkcert/{{ mkcert_version }}?for={{ binary_os }}/{{ binary_arch }}"
        dest: "{{ install_dir }}/mkcert"
        mode: "0755"
        force: true

    - name: Check whether Docker is available
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_version_out
      changed_when: false
      failed_when: false
      become: false
      environment:
        PATH: "{{ command_path }}"

    - name: Show Docker group/session requirement when unavailable
      ansible.builtin.debug:
        msg: "Docker is installed, but it is not reachable by the current shell user yet. The playbook will create the k3d cluster through a fresh sudo session for {{ docker_user }}."
      when:
        - is_linux | bool
        - docker_version_out.rc != 0

    - name: Start Docker Desktop on macOS
      ansible.builtin.command:
        argv:
          - open
          - -g
          - -a
          - Docker
      register: docker_desktop_start_out
      changed_when: docker_desktop_start_out.rc == 0
      failed_when: false
      become: false
      when:
        - is_macos | bool
        - docker_version_out.rc != 0

    - name: Wait for Docker Desktop on macOS
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_desktop_wait_out
      changed_when: false
      failed_when: false
      become: false
      environment:
        PATH: "{{ command_path }}"
      retries: 60
      delay: 5
      until: docker_desktop_wait_out.rc == 0
      when:
        - is_macos | bool
        - docker_version_out.rc != 0

    - name: Use Docker Desktop wait result on macOS
      ansible.builtin.set_fact:
        docker_version_out: "{{ docker_desktop_wait_out }}"
      when:
        - is_macos | bool
        - docker_desktop_wait_out.rc is defined

    - name: Require reachable Docker Desktop on macOS
      ansible.builtin.fail:
        msg: "Docker is not reachable. On macOS, install Docker Desktop or start it manually, then rerun this playbook."
      when:
        - is_macos | bool
        - (docker_version_out.rc | default(1)) != 0

    - name: Verify kubectl is installed
      ansible.builtin.command: kubectl version --client --output=yaml
      environment:
        PATH: "{{ command_path }}"

      register: kubectl_version_out
      changed_when: false

    - name: Verify helm is installed
      ansible.builtin.command: "{{ install_dir }}/helm version --short"
      register: helm_version_out

      changed_when: false

    - name: Verify glab is installed
      ansible.builtin.command: "{{ install_dir }}/glab version"
      register: glab_version_out
      changed_when: false

    - name: Verify helm-git plugin is installed
      ansible.builtin.command: "{{ install_dir }}/helm plugin list"
      register: helm_plugin_list_out
      changed_when: false
      failed_when: "'helm-git' not in helm_plugin_list_out.stdout"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        PATH: "{{ command_path }}"

    - name: Verify k3d is installed
      ansible.builtin.command: "{{ install_dir }}/k3d version"
      register: k3d_version_out
      changed_when: false

    - name: Verify mkcert is installed
      ansible.builtin.command: "{{ install_dir }}/mkcert --version"
      register: mkcert_version_out
      changed_when: false

    - name: Check whether k3d cluster exists
      ansible.builtin.command:
        argv:
          - "{{ install_dir }}/k3d"
          - cluster
          - get
          - "{{ k3d_cluster_name_effective }}"
      register: k3d_cluster_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
      when: create_k3d_cluster | bool

    - name: Ensure gitlabc local k3d config directory exists
      ansible.builtin.file:
        path: "{{ docker_user_home }}/.config/gitlabc"
        state: directory
        owner: "{{ docker_user }}"
        mode: "0755"
      when: create_k3d_cluster | bool

    - name: Write k3d registry pull config for local GitLab registry
      ansible.builtin.copy:
        dest: "{{ docker_user_home }}/.config/gitlabc/k3d-registries.yaml"
        owner: "{{ docker_user }}"
        mode: "0644"
        content: |
          configs:
            "registry.{{ gitlab_domain }}":
              tls:
                insecure_skip_verify: true
      when: create_k3d_cluster | bool

    - name: Build k3d cluster create command
      ansible.builtin.set_fact:
        k3d_cluster_create_argv: >-
          {{
            [
              install_dir ~ '/k3d',
              'cluster',
              'create',
              k3d_cluster_name_effective
            ]
            + ((k3s_image | trim | length > 0) | ternary(['--image', k3s_image], []))
            + [
              '--agents',
              '1',
              '--subnet',
              k3d_subnet,
              '--api-port',
              '127.0.0.1:6443',
              '--port',
              '80:80@loadbalancer',
              '--port',
              '443:443@loadbalancer',
              '--port',
              '2222:2222@loadbalancer',
              '--host-alias',
              k3d_host_gateway_ip ~ ':gitlab.' ~ gitlab_domain ~ ',registry.' ~ gitlab_domain,
              '--registry-config',
              docker_user_home ~ '/.config/gitlabc/k3d-registries.yaml',
              '--k3s-arg',
              '--disable=traefik@server:0',
              '--wait'
            ]
          }}
      when: create_k3d_cluster | bool

    - name: Create k3d cluster
      ansible.builtin.command:
        argv: "{{ k3d_cluster_create_argv }}"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
      when:
        - create_k3d_cluster | bool
        - k3d_cluster_check.rc != 0

    - name: Start existing k3d cluster
      ansible.builtin.command:
        argv:
          - "{{ install_dir }}/k3d"
          - cluster
          - start
          - "{{ k3d_cluster_name_effective }}"
          - --wait
          - --timeout
          - "{{ k3d_cluster_start_timeout }}"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
      register: k3d_cluster_start_out
      changed_when: "'Starting cluster' in (k3d_cluster_start_out.stdout ~ k3d_cluster_start_out.stderr)"
      when:
        - create_k3d_cluster | bool
        - k3d_cluster_check.rc == 0

    - name: Configure k3d nodes for local GitLab registry pulls
      ansible.builtin.command:
        argv:
          - bash
          - scripts/configure_k3d_registry_pull.sh
      args:
        chdir: "{{ playbook_dir }}"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
        K3D_CLUSTER_NAME: "{{ k3d_cluster_name_effective }}"
        GITLAB_DOMAIN: "{{ gitlab_domain }}"
      when: create_k3d_cluster | bool

    - name: Use k3d context
      ansible.builtin.command: "kubectl config use-context k3d-{{ k3d_cluster_name_effective }}"
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
      changed_when: false
      when: create_k3d_cluster | bool

    - name: Verify k3d Kubernetes API is reachable
      ansible.builtin.command: kubectl get nodes
      register: k3d_nodes_out
      changed_when: false
      until: k3d_nodes_out.rc == 0
      retries: 24
      delay: 30
      become: true
      become_user: "{{ docker_user }}"
      environment:
        HOME: "{{ docker_user_home }}"
        KUBECONFIG: "{{ docker_user_home }}/.kube/config"
        PATH: "{{ command_path }}"
      when: create_k3d_cluster | bool

    - name: Show versions
      ansible.builtin.debug:
        msg:
          - "kubectl: {{ kubectl_version_out.stdout | default('') | trim }}"
          - "helm: {{ helm_version_out.stdout | default('') | trim }}"
          - "glab: {{ glab_version_out.stdout | default('') | trim }}"
          - "helm plugins: {{ helm_plugin_list_out.stdout_lines | default([]) | select('search', 'helm-git') | list | join('; ') }}"
          - "k3d: {{ k3d_version_out.stdout | default('') | trim }}"
          - "mkcert: {{ mkcert_version_out.stdout | default('') | trim }}"
          - "docker: {{ docker_version_out.stdout | default('not reachable') | trim }}"
          - "k3d cluster: {{ k3d_cluster_name_effective if (create_k3d_cluster | bool) else 'not managed by this playbook' }}"
